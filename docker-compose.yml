services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: exhibly
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: exhibly
    ports:
      - "5432:5432"
    volumes:
      - exhibly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exhibly -d exhibly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  exhibly_postgres_data:
